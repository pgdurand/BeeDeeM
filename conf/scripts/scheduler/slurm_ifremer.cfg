# =============================================================================
# Resource file used to run jobs on DATARMOR cluster using slurm scheduler
# =============================================================================

# =============================================================================
# Default resources (mandatory)
default.queue=cpu
default.cpu= 1
default.mem=4g
default.time=04:00:00

# =============================================================================
# Only override default values for particular uses

# Diamond resources to use on Slurm
diamond.queue=cpu
diamond.cpu=8
diamond.mem=115g

# Blastcmd resources to use on Slurm
blastcmd.mem=8g
blastcmd.time=12:00:00

# Blastcmd more resources to use on Slurm
blastcmd.big.mem=32g
blastcmd.big.time=24:00:00

# Makeblastdb resources to use on Slurm
makeblastdb.mem=32g
makeblastdb.time=24:00:00

# Minimap2 resources to use on Slurm
minimap2.queue=cpu
minimap2.cpu=4
minimap2.mem=115g
minimap2.time=24:00:00

# RDP classifier resources to use on Slurm
rdp_classifier.queue=cpu
rdp_classifier.cpu=1
rdp_classifier.mem=115g
rdp_classifier.time=24:00:00

